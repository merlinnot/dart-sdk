name: Publish analyzer toolchain
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyzer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'merlinnot/dart-sdk'
    runs-on: ubuntu-24.04
    outputs:
      coordinator: ${{ steps.feature.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: pkg/analyzer/lib/src/dart/analysis
      - id: feature
        run: |
          if [[ -f pkg/analyzer/lib/src/dart/analysis/linked_summary_coordinator.dart ]]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo present=false >> "$GITHUB_OUTPUT"
            echo "Waiting for the coordinator to land on this branch." >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: source
    if: needs.source.outputs.coordinator == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            arch: arm64
            output: xcodebuild/ReleaseARM64
          - runner: ubuntu-24.04
            platform: linux-x64
            arch: x64
            output: out/ReleaseX64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      OUTPUT: ${{ matrix.output }}
      DEPOT_TOOLS_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the pinned SDK toolchains and packages
        shell: bash
        run: |
          python -m pip install PyYAML==6.0.3
          git init -q "$RUNNER_TEMP/depot_tools"
          git -C "$RUNNER_TEMP/depot_tools" fetch --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git c5d6eef1cc00425dea5b149cefe7068455ee4f56
          git -C "$RUNNER_TEMP/depot_tools" checkout --quiet FETCH_HEAD
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          gclient config --name sdk --unmanaged "https://github.com/$GITHUB_REPOSITORY.git"
          gclient sync --nohooks --no-history --shallow --revision "sdk@$GITHUB_SHA"
      - name: Build the VM, CLI and analyzer from the same commit
        working-directory: sdk
        shell: bash
        run: |
          python3 tools/generate_package_config.py
          python3 tools/generate_sdk_version_file.py
          python3 tools/build.py -m release -a "$ARCH" --no-rbe --no-siso -j 3 \
            sdk:copy_dart sdk:copy_dartvm sdk:group_dart2native sdk:copy_kernel-service_snapshot \
            sdk:copy_dartdev_aot_snapshot sdk:copy_libraries_specification sdk:copy_sdk_packages_yaml \
            sdk:copy_vm_platform sdk:copy_vm_platform_strong sdk:copy_license \
            sdk:write_version_file sdk:write_revision_file
          python tools/analyzer_release/build.py "$OUTPUT/dart-sdk"
          python tools/analyzer_release/smoke.py "$OUTPUT/dart-sdk/bin/dart" --shared
          tar -C "$OUTPUT" -czf "$RUNNER_TEMP/analyzer-$PLATFORM.tar.gz" dart-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: analyzer-${{ matrix.platform }}
          path: ${{ runner.temp }}/analyzer-*.tar.gz
          compression-level: 0
          retention-days: 2
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the verified pair
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="analyzer-$GITHUB_SHA"
          sha256sum analyzer-{linux-x64,macos-arm64}.tar.gz > SHA256SUMS
          jq -n --arg revision "$GITHUB_SHA" '{revision: $revision}' > analyzer.json
          if [[ "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Leaving latest at the last verified release."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == false ]]; then
              exit 0
            fi
            gh release upload "$tag" ./* --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Analyzer ${GITHUB_SHA:0:12}" --notes "Verified macOS arm64 and Linux x64 analyzer toolchains." ./*
          fi
          gh release edit "$tag" --draft=false --latest
